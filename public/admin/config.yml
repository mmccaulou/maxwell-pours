backend:
  name: github
  repo: mmccaulou/maxwell-pours
  branch: main
  base_url: https://maxwellpours.com

media_folder: public/images
public_folder: /images

collections:
  - name: posts
    label: Blog Posts
    folder: src/content/posts
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: string
        required: false
      - label: Publish Date
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
      - label: Hero Image
        name: heroImage
        widget: image
        required: false
      - label: Category
        name: category
        widget: select
        required: false
        options:
          - { label: "In the Glass",  value: "in-the-glass"  }
          - { label: "On the Floor",  value: "on-the-floor"  }
          - { label: "At the Table",  value: "at-the-table"  }
          - { label: "Off the Map",   value: "off-the-map"   }
          - { label: "Punch Downs",   value: "punch-downs"   }
      - label: Draft
        name: draft
        widget: boolean
        default: false
      - label: Body
        name: body
        widget: markdown

  # Work With Me services. Each file feeds BOTH the card on /work-with-me and
  # the service's own page (/work-with-me/<file-name>/). Fixed set of six:
  # no creating or deleting here, since each one has a route and a card slot.
  - name: services
    label: Services (Work With Me)
    label_singular: Service
    folder: src/content/services
    create: false
    delete: false
    extension: md
    format: frontmatter
    summary: "{{title}} ({{track}})"
    sortable_fields: [track, order, title]
    fields:
      - { label: Service Name, name: title, widget: string }
      - label: Track
        name: track
        widget: select
        options:
          - { label: "Restaurants & Wine Bars", value: "restaurants" }
          - { label: "Private Cellars",         value: "cellars"     }
      - { label: Position in Track (1–3), name: order, widget: number, value_type: int, min: 1, max: 3 }
      - { label: Tag, name: tag, widget: string, hint: "Small label above the name, e.g. From scratch" }
      - { label: Card Blurb, name: blurb, widget: text, hint: "Shown on the card and as the page intro" }
      - label: Billing Label
        name: billing
        widget: select
        options: ["One-time project", "Monthly retainer"]
      - { label: Price, name: price, widget: string, hint: "Amount only, e.g. $3,500 (the page adds “From”)" }
      - { label: Price Unit, name: priceUnit, widget: string, required: false, hint: "e.g. /month — leave blank for one-time projects" }
      - { label: Meta Description, name: description, widget: string, hint: "For search results and link previews" }
      - label: FAQ
        name: faq
        widget: list
        required: false
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: Body, name: body, widget: markdown }
