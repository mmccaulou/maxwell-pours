backend:
  name: github
  repo: mmccaulou/maxwell-pours
  branch: main
  base_url: https://maxwellpours.com

media_folder: public/images
public_folder: /images

collections:
  - name: posts
    label: Blog Posts
    folder: src/content/posts
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: string
        required: false
      - label: Publish Date
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
      - label: Hero Image
        name: heroImage
        widget: image
        required: false
      - label: Category
        name: category
        widget: select
        required: false
        options:
          - { label: "In the Glass",  value: "in-the-glass"  }
          - { label: "On the Floor",  value: "on-the-floor"  }
          - { label: "At the Table",  value: "at-the-table"  }
          - { label: "Off the Map",   value: "off-the-map"   }
          - { label: "Punch Downs",   value: "punch-downs"   }
      - label: Draft
        name: draft
        widget: boolean
        default: false
      - label: Feature on homepage
        name: featured
        widget: boolean
        default: false
        required: false
        hint: "Shows this post over the homepage photo. If several are ticked, the newest wins; if none, the newest post is shown."
      - label: Body
        name: body
        widget: markdown

  # Site-wide settings that aren't posts. Single files, not folders.
  - name: settings
    label: Site Settings
    files:
      - name: homepage
        label: Homepage
        file: src/data/homepage.json
        fields:
          - { label: Hero Photo, name: heroImage, widget: image, hint: "JPEG, about 1500–2500px wide and under 2 MB (photos are shown exactly as uploaded)" }
          - { label: Photo Description, name: heroAlt, widget: string, hint: "What the photo shows, for screen readers and search engines" }
          - { label: Photo Caption, name: heroCaption, widget: string, required: false, hint: "Small text in the corner of the photo. Leave blank to hide it." }
